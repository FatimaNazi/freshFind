<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Produce Guide | FreshFind</title>
    <meta name="description" content="FreshFind helps you discover farmers markets and seasonal produce.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Bootstrap Breadcrumb Navigation -->
    <nav aria-label="breadcrumb" class="ff-breadcrumb-nav">
        <div class="container">
            <ol class="breadcrumb mb-0 py-2">
                <li class="breadcrumb-item"><a href="index.html"><i class="bi bi-house-door me-1"></i>Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Produce Guide</li>
            </ol>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="page-hero">
        <div class="container">
            <span class="badge-soft">Seasonal produce</span>
            <h1 class="mt-3">Produce Guide</h1>
            <p class="section-sub mb-0">Browse common product types, learn their typical season and see markets where they can be found.</p>
        </div>
    </section>

    <!-- Products Section -->
    <section class="section pt-4">
        <div class="container">

            <!-- Category Filter Bar (Feature 10) -->
            <div class="filter-box p-3 p-md-4 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <span class="fw-bold small text-muted"><i class="bi bi-funnel-fill text-success me-1"></i>Filter by Category:</span>
                    <span class="badge-soft" id="produceCount">Showing all produce</span>
                </div>
                <div class="category-filter-scroll" id="categoryFilterContainer" role="tablist" aria-label="Produce Categories">
                    <button type="button" class="btn btn-category-pill active" data-category="all">
                        <i class="bi bi-grid-fill me-1"></i>All Produce
                    </button>
                    <button type="button" class="btn btn-category-pill" data-category="Fruits">
                        <i class="bi bi-apple me-1"></i>Fruits
                    </button>
                    <button type="button" class="btn btn-category-pill" data-category="Vegetables">
                        <i class="bi bi-basket me-1"></i>Vegetables
                    </button>
                    <button type="button" class="btn btn-category-pill" data-category="Herbs">
                        <i class="bi bi-flower1 me-1"></i>Herbs
                    </button>
                    <button type="button" class="btn btn-category-pill" data-category="Dairy">
                        <i class="bi bi-cup-hot me-1"></i>Dairy
                    </button>
                    <button type="button" class="btn btn-category-pill" data-category="Bakery">
                        <i class="bi bi-cake2 me-1"></i>Bakery
                    </button>
                    <button type="button" class="btn btn-category-pill" data-category="Meat">
                        <i class="bi bi-shop me-1"></i>Meat &amp; Poultry
                    </button>
                    <button type="button" class="btn btn-category-pill" data-category="Pantry">
                        <i class="bi bi-flower3 me-1"></i>Pantry &amp; Spices
                    </button>
                </div>
            </div>

            <!-- Products are loaded from products.json by assets/produce.js -->
            <div id="productsContainer" class="row g-4"></div>

        </div>
    </section>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shared scripts -->
    <script src="assets/navbar.js"></script>
    <script src="assets/footer.js"></script>
    <script src="assets/chatbot.js"></script>
    <script src="assets/validation.js"></script>
    <script src="assets/auth.js"></script>
    <script src="assets/cards.js"></script>
    <script src="assets/produce.js"></script>

</body>

</html>
