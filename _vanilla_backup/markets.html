<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Market Directory | FreshFind</title>
    <meta name="description" content="FreshFind helps you discover farmers markets and seasonal produce.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <div id="navbar"></div>

    <!-- Bootstrap Breadcrumb Navigation -->
    <nav aria-label="breadcrumb" class="ff-breadcrumb-nav">
        <div class="container">
            <ol class="breadcrumb mb-0 py-2">
                <li class="breadcrumb-item"><a href="index.html"><i class="bi bi-house-door me-1"></i>Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Market Directory</li>
            </ol>
        </div>
    </nav>

    <section class="page-hero">
        <div class="container">
            <span class="badge-soft">Directory</span>
            <h1 class="mt-3">Market Directory</h1>
            <p class="section-sub mb-0">Browse every FreshFind market &mdash; neighborhood, operating days, hours and the produce you'll find there.</p>
        </div>
    </section>

    <section class="section pt-5 pb-0">
        <div class="container">
            <div class="filter-box filter-bar p-4">
                <div class="row g-3 align-items-end">
                    <!-- Search by Area (Feature 7) -->
                    <div class="col-lg-3 col-md-6">
                        <label class="form-label fw-semibold" for="search-area"><i class="bi bi-search me-1"></i>Search by Area</label>
                        <input type="text" id="search-area" class="form-control" placeholder="e.g. Clifton, DHA, Saddar..." autocomplete="off">
                    </div>
                    <div class="col-lg-2 col-md-6">
                        <label class="form-label fw-semibold" for="filter-location">Location</label>
                        <select id="filter-location" class="form-select">
                            <option value="">All locations</option>
                        </select>
                    </div>
                    <div class="col-lg-2 col-md-4">
                        <label class="form-label fw-semibold" for="filter-day-type">Open days</label>
                        <select id="filter-day-type" class="form-select">
                            <option value="">Any day</option>
                            <option value="weekday">Weekday</option>
                            <option value="weekend">Weekend</option>
                        </select>
                    </div>
                    <div class="col-lg-2 col-md-4">
                        <label class="form-label fw-semibold" for="filter-produce">Produce</label>
                        <select id="filter-produce" class="form-select">
                            <option value="">All produce</option>
                        </select>
                    </div>
                    <div class="col-lg-1 col-md-4 form-check pb-2">
                        <input class="form-check-input" type="checkbox" id="filter-organic">
                        <label class="form-check-label fw-semibold small" for="filter-organic">Organic</label>
                    </div>
                    <div class="col-lg-2 col-md-12">
                        <label class="form-label fw-semibold" for="sort-select">Sort by</label>
                        <select id="sort-select" class="form-select">
                            <option value="default">Default</option>
                            <option value="name-asc">Name: A-Z</option>
                            <option value="name-desc">Name: Z-A</option>
                            <option value="location">Location</option>
                            <option value="rating-desc">Highest Rating</option>
                            <option value="rating-asc">Lowest Rating</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                    <span class="small text-muted"><i class="bi bi-info-circle me-1"></i>Search updates dynamically as you type.</span>
                    <button type="button" id="filter-reset" class="btn btn-outline-green btn-sm"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset Filters</button>
                </div>
            </div>
        </div>
    </section>

    <section class="section pt-4">
        <div class="container">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h5 mb-0">Available markets</h2>
                <span class="text-secondary" id="market-count">0 markets</span>
            </div>

            <div class="row g-4" id="market-list">
            </div>

        </div>
    </section>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/navbar.js"></script>
    <script src="assets/footer.js"></script>
    <script src="assets/chatbot.js"></script>
    <script src="assets/validation.js"></script>
    <script src="assets/auth.js"></script>
    <script src="assets/cards.js"></script>
    <script src="assets/market.js"></script>
</body>

</html>
