<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Seasonal Guide | FreshFind</title>
    <meta name="description" content="Explore seasonal produce guides, harvest calendars, and peak freshness across local markets.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Bootstrap Breadcrumb Navigation -->
    <nav aria-label="breadcrumb" class="ff-breadcrumb-nav">
        <div class="container">
            <ol class="breadcrumb mb-0 py-2">
                <li class="breadcrumb-item"><a href="index.html"><i class="bi bi-house-door me-1"></i>Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Seasonal Guide</li>
            </ol>
        </div>
    </nav>

    <!-- Page Hero -->
    <section class="page-hero">
        <div class="container">
            <span class="badge-soft">Harvest Calendar</span>
            <h1 class="mt-3">Seasonal Produce Guide</h1>
            <p class="section-sub mb-0">Discover what's naturally ripe, freshest, and most flavorful in every season across neighborhood farmers markets.</p>
        </div>
    </section>

    <!-- Seasonal Content Section -->
    <section class="section pt-4">
        <div class="container">

            <!-- Season-Wise Filter Bar (Requested) -->
            <div class="filter-box p-3 p-md-4 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <span class="fw-bold small text-muted"><i class="bi bi-calendar-range-fill text-success me-1"></i>Filter by Season:</span>
                    <span class="badge-soft" id="seasonalCount">Showing all seasons</span>
                </div>
                <div class="season-filter-scroll" id="seasonFilterContainer" role="tablist" aria-label="Seasonal Produce Filters">
                    <button type="button" class="btn btn-season-pill active" data-season="all">
                        <i class="bi bi-grid-fill me-1"></i>All Seasons
                    </button>
                    <button type="button" class="btn btn-season-pill" data-season="Summer">
                        <i class="bi bi-sun-fill text-warning me-1"></i>Summer
                    </button>
                    <button type="button" class="btn btn-season-pill" data-season="Winter">
                        <i class="bi bi-snow text-info me-1"></i>Winter
                    </button>
                    <button type="button" class="btn btn-season-pill" data-season="Spring">
                        <i class="bi bi-flower1 text-success me-1"></i>Spring
                    </button>
                    <button type="button" class="btn btn-season-pill" data-season="Autumn">
                        <i class="bi bi-tree-fill text-danger me-1"></i>Autumn
                    </button>
                    <button type="button" class="btn btn-season-pill" data-season="Year-round">
                        <i class="bi bi-arrow-repeat text-primary me-1"></i>Year-Round
                    </button>
                </div>
            </div>

            <!-- Seasonal Items Loaded Dynamically from assets/seasonal.json -->
            <div id="seasonalContainer" class="row g-4"></div>

        </div>
    </section>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shared scripts -->
    <script src="assets/navbar.js"></script>
    <script src="assets/footer.js"></script>
    <script src="assets/chatbot.js"></script>
    <script src="assets/validation.js"></script>
    <script src="assets/auth.js"></script>
    <script src="assets/cards.js"></script>
    <!-- Seasonal Guide Controller -->
    <script src="assets/seasonal.js"></script>

</body>

</html>
